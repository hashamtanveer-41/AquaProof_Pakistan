server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        access_log off;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_set_header Host $http_host;
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
